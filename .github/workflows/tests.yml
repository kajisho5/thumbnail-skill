name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install a CJK font (Linux)
        # macOS and Windows runners ship a CJK-capable font already (PingFang / Yu Gothic);
        # a bare Ubuntu runner does not, and fonts.py never assumes one, so the `cjk` font_id
        # would otherwise be MISSING_INPUT and the CJK-text tests would skip on Linux only.
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-wqy-zenhei
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Fetch ffmpeg-skill (video frame decoding only; pinned to the commit this skill was verified against)
        run: |
          git clone https://github.com/kajisho5/ffmpeg-skill vendor/ffmpeg-skill
          git -C vendor/ffmpeg-skill checkout 2abd89c
        shell: bash
      - run: ffprobe -version
        shell: bash
      - run: python -m pip install -e . pytest pyflakes
      - run: python -m pyflakes src tests
      - run: python -m pytest -q
        env:
          THUMBNAIL_SKILL_FFMPEG_SKILL_DIR: ${{ github.workspace }}/vendor/ffmpeg-skill
      - run: thumbnail doctor --json --ffmpeg-skill vendor/ffmpeg-skill
        shell: bash
      - run: thumbnail skill --json > contract.json
        shell: bash
      - run: python -c "import json; json.load(open('contract.json'))"
