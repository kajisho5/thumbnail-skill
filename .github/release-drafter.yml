# Shared configuration for:
#   - .github/workflows/release-drafter.yml (autolabeler: labels PRs on open/sync)
#   - .github/workflows/release.yml         (dry-run: resolves the next version + changelog body)
#
# Label vocabulary is deliberately small and maps 1:1 to both the changelog section a PR's
# entry lands in and the semver level it drives. A PR with none of these labels still gets a
# changelog entry (under "Other changes") and still counts toward the version bump -- as a
# patch, via each category's own `semver-increment` default (see release-drafter's schema).
#
# 'major' is deliberately absent from `autolabeler` below: it is the only label a human must
# attach by hand. A text-pattern autolabeler rule for it (matching a title prefix like
# "breaking:"/"major:", or a body containing the string "BREAKING CHANGE") was considered and
# rejected -- that string can appear for reasons that have nothing to do with actually shipping
# a breaking change (e.g. a PR whose *description* discusses a past incident, a bug report, or
# quoted text), and a false-positive 'major' label reaching this repo's release.yml unreviewed
# would resolve and tag a real, unintended major version. Autolabeling every other level (which
# only bumps minor/patch) is comparatively low-stakes and stays automatic.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

autolabeler:
  - label: 'feature'
    title:
      - '/^(add|feat|feature|implement|new)\b/i'
    branch:
      - '/^(feat|feature)\//'
  - label: 'fix'
    title:
      - '/^(fix|bug|bugfix|hotfix|reclassify)\b/i'
    branch:
      - '/^fix\//'
  - label: 'security'
    title:
      - '/^(security|sec)\b/i'
    files:
      - 'SECURITY.md'
  - label: 'documentation'
    title:
      - '/^docs?\b/i'
    files:
      - 'docs/**'
      - '*.md'
  - label: 'chore'
    title:
      - '/^(chore|refactor|repin|bump|update|clean|maintenance)\b/i'
    branch:
      - '/^chore\//'
    files:
      - '.github/**'

categories:
  - title: '💥 Breaking Changes'
    semver-increment: 'major'
    when:
      # 'major' is never applied by autolabeler (see the note above) -- only a human
      # attaching it by hand on the PR puts a change here / triggers a major bump.
      labels: ['major']
  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      labels: ['minor', 'feature']
  - title: '🔒 Security'
    semver-increment: 'patch'
    when:
      labels: ['security']
  - title: '🐛 Bug Fixes'
    semver-increment: 'patch'
    when:
      labels: ['fix', 'patch']
  - title: '📝 Documentation'
    semver-increment: 'patch'
    when:
      labels: ['documentation']
  - title: '🧰 Maintenance'
    semver-increment: 'patch'
    when:
      labels: ['chore']
  - title: 'Other changes'
    # No `when:` -- catches anything not claimed by a category above. No explicit
    # semver-increment either: release-drafter defaults an omitted one to 'patch',
    # which is exactly the "no label -> patch" rule this file exists to encode.

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

exclude-labels:
  - 'skip-changelog'
