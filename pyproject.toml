[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thumbnail-skill"
version = "0.1.8"
description = "Deterministic thumbnail rendering execution Skill: a typed ThumbnailDocument (canvas + image/text elements) in, a validated PNG/JPEG artifact with provenance out. Not an AI agent; never decides what a thumbnail should show."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["thumbnail", "image", "rendering", "skill", "ffmpeg"]
# Pillow floor per Python (ADR-10): 13.0.0 clears every published advisory but needs Python 3.11;
# 3.10 and 3.9 get the newest Pillow that still supports them.
dependencies = [
    "Pillow>=13.0.0; python_version >= '3.11'",
    "Pillow>=12.3.0; python_version == '3.10'",
    "Pillow>=11.3.0; python_version < '3.10'",
]

[project.optional-dependencies]
# The optional AI background provider (ADR-12): FLUX.2 [klein] 4B through diffusers' Flux2KleinPipeline (added in
# diffusers 0.37.0), whose text encoder is transformers' Qwen3. Weights are never downloaded by this skill.
flux2 = ["torch", "diffusers>=0.37.0", "transformers>=4.51.0"]

[project.scripts]
thumbnail = "thumbnail_skill.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/thumbnail-skill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = false
warn_unused_ignores = false
